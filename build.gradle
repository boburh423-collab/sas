plugins {
    id 'com.android.application'
}

android {
    namespace "com.towerdefense"
    compileSdk 34

    defaultConfig {
        applicationId "com.towerdefense.game"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            assets.srcDirs = ['src/main/assets', '../core/assets']
            res.srcDirs = ['src/main/res']
            jni.srcDirs = []
        }
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/robovm/ios/robovm.xml',
                'META-INF/INDEX.LIST',
                'META-INF/*.SF',
                'META-INF/*.DSA',
                'META-INF/*.RSA'
            ]
            pickFirsts += [
                '**/libgdx.so',
                '**/libGDX.so',
                '**/libstb.so'
            ]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
}

configurations {
    natives
}

dependencies {
    implementation project(':core')

    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"

    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"

    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86_64"
}

// Copy native libs
task copyAndroidNatives() {
    file("src/main/jniLibs").mkdirs()

    configurations.natives.copy().files.each { jar ->
        def outputDir = null

        if (jar.name.contains("arm64-v8a")) outputDir = file("src/main/jniLibs/arm64-v8a")
        if (jar.name.contains("armeabi-v7a")) outputDir = file("src/main/jniLibs/armeabi-v7a")
        if (jar.name.contains("x86_64")) outputDir = file("src/main/jniLibs/x86_64")
        if (jar.name.contains("x86")) outputDir = file("src/main/jniLibs/x86")

        if (outputDir != null) {
            outputDir.mkdirs()
            copy {
                from zipTree(jar)
                into outputDir
                include "*.so"
            }
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name.contains("assemble") || task.name.contains("package")) {
        task.dependsOn copyAndroidNatives
    }
}
