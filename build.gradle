// Top-level build file

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Android Gradle Plugin
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

// Barcha projectlar uchun repo
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// 🔥 LibGDX versiyalarini shu yerda beramiz
ext {
    gdxVersion = "1.12.0"
    aiVersion = "1.8.2"
}

// Clean task
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
