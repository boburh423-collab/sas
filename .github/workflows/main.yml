## 🎮 What's new in ${{ github.ref_name }}
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

            ## 📦 Build info
            | Key | Value |
            |-----|-------|
            | Commit | ${{ github.sha }} |
            | Built on | ubuntu-latest |
            | Java | ${{ env.JAVA_VERSION }} |
            | Android API | ${{ env.ANDROID_API }} |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════════════
  #  JOB 2 — Lint
  # ══════════════════════════════════════════════════════════════════════
  lint:
    name: 🔍 Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: []   # runs in parallel with build

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🛠️ Install SDK components
        run: sdkmanager "platforms;android-${{ env.ANDROID_API }}" "build-tools;${{ env.BUILD_TOOLS }}"

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-lint-${{ hashFiles('**/*.gradle*') }}

      - name: 🔑 Make gradlew executable
        run: chmod +x gradlew

      - name: 🔍 Run Android Lint
        run: ./gradlew :android:lint --no-daemon

      - name: 📤 Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            android/build/reports/lint-results-debug.html
            android/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════
  #  JOB 3 — Notify (summary)
  # ══════════════════════════════════════════════════════════════════════
  notify:
    name: 📣 Build Summary
    runs-on: ubuntu-latest
    needs: [ build, lint ]
    if: always()

    steps:
      - name: 📋 Print summary
        run: |
          echo "## 🏰 Tower Defense Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job    | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build  | ${{ needs.build.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint   | ${{ needs.lint.result  == 'success' && '✅ Success' || '⚠️ Issues' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \${{ github.sha }}\" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \${{ github.ref_name }}\" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download APK from Actions → Artifacts above." >> $GITHUB_STEP_SUMMARY
