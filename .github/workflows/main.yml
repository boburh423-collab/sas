name: Tower Defense Build APK

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  ANDROID_API: '34'
  BUILD_TOOLS: '34.0.0'
  GRADLE_VERSION: '8.2'

jobs:

  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --update
          sdkmanager \
            "platforms;android-${{ env.ANDROID_API }}" \
            "build-tools;${{ env.BUILD_TOOLS }}" \
            "platform-tools"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version=${{ env.GRADLE_VERSION }} --distribution-type=bin

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :android:assembleDebug \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Build Release APK
        run: |
          ./gradlew :android:assembleRelease \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Collect APK artifacts
        run: |
          mkdir -p artifacts
          DEBUG="android/build/outputs/apk/debug/android-debug.apk"
          if [ -f "$DEBUG" ]; then
            cp "$DEBUG" artifacts/TowerDefense-debug.apk
            echo "Debug APK ready: $(du -sh $DEBUG | cut -f1)"
          fi
          UNSIGNED="android/build/outputs/apk/release/android-release-unsigned.apk"
          if [ -f "$UNSIGNED" ]; then
            cp "$UNSIGNED" artifacts/TowerDefense-release-unsigned.apk
            echo "Release APK ready: $(du -sh $UNSIGNED | cut -f1)"
          fi
          ls -lh artifacts/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TowerDefense-Debug-APK
          path: artifacts/TowerDefense-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TowerDefense-Release-APK
          path: artifacts/TowerDefense-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Tower Defense ${{ github.ref_name }}"
          files: |
            artifacts/TowerDefense-debug.apk
            artifacts/TowerDefense-release-unsigned.apk
          body: |
            ## Tower Defense ${{ github.ref_name }}

            ### Installation
            1. Download TowerDefense-debug.apk
            2. Enable Unknown Sources on your Android device
            3. Open the APK and tap Install

            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager \
            "platforms;android-${{ env.ANDROID_API }}" \
            "build-tools;${{ env.BUILD_TOOLS }}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version=${{ env.GRADLE_VERSION }} --distribution-type=bin

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew :android:lint --no-daemon

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [ build, lint ]
    if: always()

    steps:
      - name: Write summary
        run: |
          echo "## Tower Defense Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job   | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint  | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
