name: Tower Defense Build APK

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug / release / both)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

env:
  JAVA_VERSION: '17'
  ANDROID_API: '34'
  BUILD_TOOLS: '34.0.0'

jobs:

  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --update
          sdkmanager \
            "platforms;android-${{ env.ANDROID_API }}" \
            "build-tools;${{ env.BUILD_TOOLS }}" \
            "platform-tools"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Print build info
        run: |
          echo "=== Build Environment ==="
          java -version
          ./gradlew --version
          echo "Branch:  ${{ github.ref_name }}"
          echo "Commit:  ${{ github.sha }}"
          echo "Trigger: ${{ github.event_name }}"

      - name: Build Debug APK
        run: |
          ./gradlew :android:assembleDebug \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Build Release APK (unsigned)
        run: |
          ./gradlew :android:assembleRelease \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Sign Release APK
        if: ${{ secrets.SIGNING_KEY != '' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: android/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS }}

      - name: Collect APK artifacts
        run: |
          mkdir -p artifacts
          DEBUG="android/build/outputs/apk/debug/android-debug.apk"
          if [ -f "$DEBUG" ]; then
            cp "$DEBUG" artifacts/TowerDefense-debug.apk
            echo "Debug APK ready"
          fi
          SIGNED="${{ steps.sign_apk.outputs.signedReleaseFile }}"
          UNSIGNED="android/build/outputs/apk/release/android-release-unsigned.apk"
          if [ -f "$SIGNED" ]; then
            cp "$SIGNED" artifacts/TowerDefense-release-signed.apk
            echo "Signed release APK ready"
          elif [ -f "$UNSIGNED" ]; then
            cp "$UNSIGNED" artifacts/TowerDefense-release-unsigned.apk
            echo "Unsigned release APK ready"
          fi
          echo "=== Artifacts ==="
          ls -lh artifacts/

      - name: APK size report
        run: |
          for f in artifacts/*.apk; do
            [ -f "$f" ] && echo "$(basename $f): $(du -sh $f | cut -f1)"
          done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TowerDefense-Debug-APK
          path: artifacts/TowerDefense-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TowerDefense-Release-APK
          path: |
            artifacts/TowerDefense-release-signed.apk
            artifacts/TowerDefense-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Tower Defense ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            artifacts/TowerDefense-debug.apk
            artifacts/TowerDefense-release-signed.apk
            artifacts/TowerDefense-release-unsigned.apk
          body: |
            ## Tower Defense ${{ github.ref_name }}

            ### Installation
            1. Download TowerDefense-debug.apk
            2. Enable Unknown Sources on your Android device
            3. Open the APK and tap Install

            ### Build info
            - Commit: ${{ github.sha }}
            - Java: ${{ env.JAVA_VERSION }}
            - Android API: ${{ env.ANDROID_API }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager \
            "platforms;android-${{ env.ANDROID_API }}" \
            "build-tools;${{ env.BUILD_TOOLS }}"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-lint-${{ hashFiles('**/*.gradle*') }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew :android:lint --no-daemon

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [ build, lint ]
    if: always()

    steps:
      - name: Write summary
        run: |
          echo "## Tower Defense Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job   | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint  | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Download APK from Actions -> Artifacts" >> $GITHUB_STEP_SUMMARY
